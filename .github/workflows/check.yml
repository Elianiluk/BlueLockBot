name: Check Blue Lock chapters

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes
  workflow_dispatch:          # "Run workflow" button for manual runs

permissions:
  contents: write

concurrency: check

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python check.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Save state
        run: |
          git config user.name "bluelock-bot"
          git config user.email "bluelock-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "Update last chapter" && git push)
